# ==============================================================================
# 🎬 fnOS STRM Autopilot - 伴生服务 Docker Compose 模板
# 用于在飞牛 NAS 或辅助 Docker 节点上一键拉起搜源与调度伴生服务
# ==============================================================================

version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. PanSou 网盘资源聚合搜盘引擎 (端口 8888)
  # 支持毫秒级并发检索 115 与夸克网盘分享资源
  # ----------------------------------------------------------------------------
  pansou:
    image: fish2018/pansou:latest
    container_name: fnos-pansou
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data/pansou:/app/data
    networks:
      - media-net

  # ----------------------------------------------------------------------------
  # 2. STRM Autopilot 巡检调度器容器 (轻量 Python 运行环境)
  # ----------------------------------------------------------------------------
  autopilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fnos-strm-autopilot
    restart: unless-stopped
    depends_on:
      - pansou
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
      # 若运行在飞牛 NAS 宿主机，可直接映射飞牛影视数据库做只读挂载
      # - /usr/local/apps/@appdata/trim.media/database:/app/trimmedia:ro
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    networks:
      - media-net

networks:
  media-net:
    driver: bridge
